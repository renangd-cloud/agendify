name: Bug
description: Algo que deveria funcionar e não está funcionando
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: O que aconteceu
      description: Descreva o comportamento observado
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: O que era esperado
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Vá para '...'
        2. Clique em '...'
        3. Veja o erro
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Ambiente
      options:
        - Local (docker compose)
        - Produção (Azure)
        - CI
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace (se houver)
      render: shell
    validations:
      required: false
